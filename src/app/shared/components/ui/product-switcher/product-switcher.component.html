            <span class="min-w-0 flex-1">
              <span class="block text-sm font-semibold text-slate-900">{{ product.name }}</span>
              <span class="block truncate text-xs text-slate-500 font-medium">{{ product.description }}</span>
            </span>
            <span class="shrink-0 rounded-xs bg-blue-100 px-2.5 py-0.5 text-[11px] font-bold text-blue-600">Current</span>
          </div>
        </ng-container>

        <ng-template #productRow>
          <div class="rounded-md p-3 hover:bg-blue-50">
          
          <button class="flex items-center gap-3 w-full text-left cursor-pointer hover:bg-blue-50"
            [class.bg-slate-50/70 ring-1 ring-slate-100]="product.status === 'active'"
            [disabled]="isSwitching"
            (click)="selectProduct(product); $event.preventDefault()"
            type="button">
            <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-md {{ product.iconBg }} text-white">
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [innerHTML]="product.icon"></svg>
            </span>
            <span class="min-w-0 flex-1">
              <span class="block text-sm font-semibold text-slate-900">{{ product.name }}</span>
              <span class="block truncate text-xs text-slate-500 font-medium">{{ product.description }}</span>
            </span>
            <span class="shrink-0 rounded-xs bg-green-50 px-2.5 py-0.5 text-[11px] font-bold text-green-600"
              *ngIf="product.status === 'active'">Active</span>
            <span class="shrink-0 rounded-xs bg-green-50 px-2.5 py-0.5 text-[11px] font-bold text-green-600"
              *ngIf="product.status === 'available'">Available</span>
          </button>
          <p class="mt-3 text-xs leading-relaxed text-slate-500 font-medium" *ngIf="product.descriptionText">
            {{ product.descriptionText }}
          </p>
          <a [href]="product.actionHref || '#'" role="menuitem"
            class="mt-3 flex w-full items-center justify-center gap-2 rounded-sm border border-blue-600 bg-white px-4 py-2 text-sm font-bold text-blue-600 transition hover:bg-blue-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
            *ngIf="product.actionLabel"
            (click)="selectProduct(product); $event.preventDefault()">
            {{ product.actionLabel }}
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
          
          </div>
        </ng-template>
      </ng-container>
    </div>

    <!-- Footer -->
    <a [href]="exploreAllHref" role="menuitem"
      class="flex items-center gap-3 border-t border-slate-200 px-5 py-4 hover:bg-slate-50">
      <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-md bg-slate-100 text-slate-500">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v9H5v-9M7.500 8a2.500 2.500 0 1 1 0-5C11 3 12 8 12 8s1-5 4.500-5a2.500 2.500 0 1 1 0 5"/></svg>
      </span>
      <span class="min-w-0 flex-1">
        <span class="block text-sm font-semibold text-slate-900">Explore All Products</span>
        <span class="block truncate text-xs text-slate-500 font-medium">Discover more Sentinel solutions</span>
      </span>
      <svg class="h-4 w-4 shrink-0 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
    </a>
  </div>
</div>
